<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SportPulse · Lig listesi giriş animasyonları</title>
<style>
  :root {
    --bg: #0f1a14;
    --surface: #16241d;
    --line: #24382d;
    --ink: #eef5f0;
    --ink-2: #9fb5a8;
    --primary: #2fbf71;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px 24px 64px;
    background: radial-gradient(1200px 600px at 50% -10%, #16281f, var(--bg));
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
  }
  h1 { font-size: 22px; margin: 0 0 6px; }
  p.sub { margin: 0 0 24px; color: var(--ink-2); font-size: 14px; }
  .toolbar {
    position: sticky; top: 0; z-index: 5;
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
    padding: 12px 16px; margin-bottom: 28px;
    background: rgba(15,26,20,.85); backdrop-filter: blur(8px);
    border: 1px solid var(--line); border-radius: 16px;
  }
  button {
    font: inherit; font-weight: 600; font-size: 14px;
    color: #04120a; background: var(--primary);
    border: 0; border-radius: 10px; padding: 9px 16px; cursor: pointer;
  }
  button.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  label { font-size: 13px; color: var(--ink-2); display: flex; align-items: center; gap: 8px; }
  input[type=range] { accent-color: var(--primary); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 28px;
  }
  .variant { display: flex; flex-direction: column; gap: 10px; }
  .variant header { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .variant h2 { font-size: 15px; margin: 0; }
  .variant .tag { font-size: 12px; color: var(--ink-2); }
  .variant .desc { font-size: 12.5px; color: var(--ink-2); margin: 0; min-height: 32px; }

  .phone {
    border: 1px solid var(--line); border-radius: 26px; padding: 14px;
    background: var(--bg); overflow: hidden;
    box-shadow: 0 20px 40px rgba(0,0,0,.35);
    cursor: pointer;
  }
  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 18px; padding: 14px;
  }
  .card h3 { font-size: 14px; margin: 0 0 10px; }
  .row {
    display: flex; align-items: center; gap: 12px; padding: 9px 2px;
    will-change: transform, opacity, filter;
  }
  .box {
    width: 20px; height: 20px; border-radius: 6px;
    border: 2px solid var(--ink-2); flex: none;
  }
  .row.on .box { border-color: var(--primary); background: var(--primary); }
  .logo { width: 22px; height: 22px; border-radius: 99px; background: #ffffff22; flex: none; }
  .name { font-size: 13.5px; }
  .chev { margin-left: auto; color: var(--ink-2); font-size: 12px; }

  pre {
    margin: 0; padding: 10px 12px; font-size: 11.5px; line-height: 1.5;
    background: #0b1611; border: 1px solid var(--line); border-radius: 12px;
    color: #bfe6cf; overflow-x: auto;
  }

  /* ---------- 1. Soldan kayarak (klasik) ---------- */
  .a-left .row { animation: slideLeft var(--dur) cubic-bezier(.22,1,.36,1) both; }
  @keyframes slideLeft { from { opacity: 0; transform: translateX(-28px); } to { opacity: 1; transform: none; } }

  /* ---------- 2. Soldan yaylı (spring) ---------- */
  .a-spring .row { animation: springLeft calc(var(--dur) * 1.9) cubic-bezier(.2,1.5,.4,1) both; }
  @keyframes springLeft { from { opacity: 0; transform: translateX(-40px); } 60% { opacity: 1; } to { opacity: 1; transform: none; } }

  /* ---------- 3. Perde / wipe ---------- */
  .a-wipe .row { animation: wipe var(--dur) ease-out both; }
  @keyframes wipe {
    from { opacity: 0; clip-path: inset(0 100% 0 0); transform: translateX(-10px); }
    to { opacity: 1; clip-path: inset(0 0 0 0); transform: none; }
  }

  /* ---------- 4. Aşağıdan yükselerek ---------- */
  .a-up .row { animation: riseUp var(--dur) cubic-bezier(.22,1,.36,1) both; }
  @keyframes riseUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  /* ---------- 5. Ölçek pop ---------- */
  .a-pop .row { animation: pop calc(var(--dur) * 1.2) cubic-bezier(.2,1.4,.4,1) both; transform-origin: left center; }
  @keyframes pop { from { opacity: 0; transform: scale(.86); } to { opacity: 1; transform: scale(1); } }

  /* ---------- 6. Kağıt katlanması (3D) ---------- */
  .a-flip .card { perspective: 700px; }
  .a-flip .row { animation: flipIn calc(var(--dur) * 1.3) cubic-bezier(.22,1,.36,1) both; transform-origin: top center; }
  @keyframes flipIn { from { opacity: 0; transform: rotateX(-70deg); } to { opacity: 1; transform: none; } }

  /* ---------- 7. Sadece soluklaşma ---------- */
  .a-fade .row { animation: fadeOnly var(--dur) ease-out both; }
  @keyframes fadeOnly { from { opacity: 0; } to { opacity: 1; } }

  /* ---------- 8. Yelpaze (soldan + hafif eğim) ---------- */
  .a-fan .row { animation: fan calc(var(--dur) * 1.25) cubic-bezier(.22,1,.36,1) both; transform-origin: left center; }
  @keyframes fan {
    from { opacity: 0; transform: translateX(-24px) rotate(-3deg) scale(.96); }
    to { opacity: 1; transform: none; }
  }
</style>
</head>
<body>

<h1>Lig listesi giriş animasyonları</h1>
<p class="sub">Her karta (veya “Tekrar oynat”a) tıklayınca animasyon yeniden başlar. Beğendiğinin numarasını söyle, uygulamaya onu uygularım.</p>

<div class="toolbar">
  <button id="replay">Hepsini tekrar oynat</button>
  <label>Süre <input id="dur" type="range" min="80" max="500" step="10" value="120" /> <span id="durVal">120ms</span></label>
  <label>Gecikme adımı <input id="stagger" type="range" min="0" max="160" step="5" value="88" /> <span id="stagVal">88ms</span></label>
  <label><input id="loop" type="checkbox" /> Sürekli döngü</label>
  <button class="ghost" id="light">Açık tema</button>
</div>

<div class="grid" id="grid"></div>

<script>
const LEAGUES = [
  'Süper Lig', 'Premier League', 'La Liga', 'Serie A',
  'Bundesliga', 'Ligue 1', 'Şampiyonlar Ligi', 'Eredivisie'
];

const VARIANTS = [
  {
    cls: 'a-left', name: '1 · Soldan kayarak',
    desc: 'Her satır soldan içeri kayar, üstten alta sırayla. Klasik ve sakin.',
    code: `entering={FadeInLeft.delay(i * 35).duration(170)}`
  },
  {
    cls: 'a-spring', name: '2 · Soldan yaylı',
    desc: 'Aynı yön, ama sonunda ufak bir esneme var. Daha canlı durur.',
    code: `entering={FadeInLeft.delay(i * 35).springify().damping(14)}`
  },
  {
    cls: 'a-wipe', name: '3 · Perde açılışı',
    desc: 'Satır soldan sağa doğru “açılarak” ortaya çıkar; kayma değil, açılma.',
    code: `// Reanimated: clip yerine width/opacity ile\n// veya MaskedView + withTiming(1) genişleme`
  },
  {
    cls: 'a-up', name: '4 · Aşağıdan yükselerek',
    desc: 'Satırlar hafifçe yukarı doğru gelir. Liste hissi güçlü ama dikey oynama riski var.',
    code: `entering={FadeInDown.delay(i * 35).duration(170)}`
  },
  {
    cls: 'a-pop', name: '5 · Ölçek pop',
    desc: 'Soldan büyüyerek belirir. Kaymasız, yer değiştirmediği için hiç zıplamaz.',
    code: `entering={ZoomIn.delay(i * 35).duration(200)}`
  },
  {
    cls: 'a-flip', name: '6 · Kağıt katlanması',
    desc: 'Satırlar üst kenarından aşağı devrilerek açılır. Efektli, dikkat çeker.',
    code: `// useAnimatedStyle + rotateX: withDelay(i*35, withTiming(0))`
  },
  {
    cls: 'a-fade', name: '7 · Sadece soluklaşma',
    desc: 'Hiç hareket yok, yalnızca opaklık. Şu an uygulamada olan sakin hâli.',
    code: `entering={FadeIn.delay(i * 20).duration(140)}`
  },
  {
    cls: 'a-fan', name: '8 · Yelpaze',
    desc: 'Soldan gelirken çok hafif dönerek düzelir. Kart destesi açılıyor gibi.',
    code: `// FadeInLeft + rotate: withDelay(i*35, withSpring(0))`
  },
];

const grid = document.getElementById('grid');

VARIANTS.forEach((v) => {
  const el = document.createElement('div');
  el.className = 'variant';
  el.innerHTML = `
    <header><h2>${v.name}</h2><span class="tag">tıkla → tekrar</span></header>
    <p class="desc">${v.desc}</p>
    <div class="phone ${v.cls}">
      <div class="card">
        <h3>Ligler</h3>
        ${LEAGUES.map((n, i) => `
          <div class="row${i < 2 ? ' on' : ''}" style="--i:${i}">
            <div class="box"></div>
            <div class="logo"></div>
            <div class="name">${n}</div>
            <div class="chev">›</div>
          </div>`).join('')}
      </div>
    </div>
    <pre>${v.code}</pre>
  `;
  el.querySelector('.phone').addEventListener('click', () => play(el.querySelector('.phone')));
  grid.appendChild(el);
});

const durInput = document.getElementById('dur');
const stagInput = document.getElementById('stagger');

function applyTiming() {
  document.getElementById('durVal').textContent = durInput.value + 'ms';
  document.getElementById('stagVal').textContent = stagInput.value + 'ms';
  document.documentElement.style.setProperty('--dur', durInput.value + 'ms');
  document.querySelectorAll('.row').forEach((row) => {
    const i = Number(row.style.getPropertyValue('--i'));
    row.style.animationDelay = i * Number(stagInput.value) + 'ms';
  });
}

function play(phone) {
  phone.querySelectorAll('.row').forEach((row) => {
    row.style.animation = 'none';
    void row.offsetWidth;
    row.style.animation = '';
  });
  applyTiming();
}

function playAll() { document.querySelectorAll('.phone').forEach(play); }

document.getElementById('replay').addEventListener('click', playAll);
durInput.addEventListener('input', applyTiming);
stagInput.addEventListener('input', applyTiming);

let timer = null;
document.getElementById('loop').addEventListener('change', (e) => {
  clearInterval(timer);
  if (e.target.checked) timer = setInterval(playAll, 2200);
});

document.getElementById('light').addEventListener('click', (e) => {
  const light = document.body.classList.toggle('light');
  const r = document.documentElement.style;
  if (light) {
    r.setProperty('--bg', '#f4f7f5'); r.setProperty('--surface', '#ffffff');
    r.setProperty('--line', '#e2e8e4'); r.setProperty('--ink', '#0f1a14');
    r.setProperty('--ink-2', '#5c6f64');
    e.target.textContent = 'Koyu tema';
  } else {
    r.setProperty('--bg', '#0f1a14'); r.setProperty('--surface', '#16241d');
    r.setProperty('--line', '#24382d'); r.setProperty('--ink', '#eef5f0');
    r.setProperty('--ink-2', '#9fb5a8');
    e.target.textContent = 'Açık tema';
  }
});

applyTiming();
</script>
</body>
</html>
